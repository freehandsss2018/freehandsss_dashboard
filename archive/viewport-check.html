<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<!-- 刻意用同 freehandsss_dashboardV42.html 完全一樣嘅 viewport 設定，先至有比較價值 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FHS Viewport 診斷</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin:0; padding:12px;
         background:#FAF6F1; color:#2b2b2b; }
  h1 { font-size:18px; margin:0 0 10px; color:#B5603B; }
  table { width:100%; border-collapse:collapse; }
  td { padding:6px 4px; border-bottom:1px solid #e0d8cd; font-size:15px; }
  td.k { color:#7A6A55; white-space:nowrap; }
  td.v { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .big { font-size:34px; font-weight:900; text-align:center; padding:14px 0;
         border-radius:10px; margin-bottom:12px; }
  .desktop { background:#dcfce7; color:#166534; }
  .mobile  { background:#fee2e2; color:#b91c1c; }
  .hint { font-size:13px; color:#7A6A55; margin-top:12px; line-height:1.5; }
</style>
</head>
<body>
<h1>FHS Viewport 診斷（轉方向會自動更新）</h1>
<div id="verdict" class="big">…</div>
<table><tbody id="rows"></tbody></table>
<p class="hint">請喺 iPhone <b>橫向</b>狀態影一張截圖俾 Claude。<br>
綠色＝應該出 desktop 表格；紅色＝會出手機卡片。</p>

<script>
function render() {
  var vv = window.visualViewport || {};
  var isDesktop = window.matchMedia('(min-width: 768px)').matches;
  var v = document.getElementById('verdict');
  v.textContent = (isDesktop ? '✅ DESKTOP (≥768)' : '❌ MOBILE (<768)');
  v.className = 'big ' + (isDesktop ? 'desktop' : 'mobile');

  var data = [
    ['window.innerWidth',  window.innerWidth],
    ['window.innerHeight', window.innerHeight],
    ['documentElement.clientWidth', document.documentElement.clientWidth],
    ['screen.width',  window.screen.width],
    ['screen.height', window.screen.height],
    ['devicePixelRatio', window.devicePixelRatio],
    ['visualViewport.width', vv.width !== undefined ? Math.round(vv.width) : 'n/a'],
    ['visualViewport.scale', vv.scale !== undefined ? vv.scale : 'n/a'],
    ['media (min-width:768px)', isDesktop],
    ['media (orientation)', window.matchMedia('(orientation: landscape)').matches ? 'landscape' : 'portrait']
  ];
  document.getElementById('rows').innerHTML = data.map(function(r) {
    return '<tr><td class="k">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>';
  }).join('');
}
render();
window.addEventListener('resize', render);
window.addEventListener('orientationchange', function(){ setTimeout(render, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', render);
</script>
</body>
</html>
